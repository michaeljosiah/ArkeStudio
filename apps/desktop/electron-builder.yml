# Packaging (SPEC-016 §2.5, R-7, R-8): the client, coordinator, harness binary, voice sidecar,
# ffmpeg, espeak-ng and the native index binding — per architecture. Local inference models are
# NOT installer contents; they download on first use (R-5, D3). The bundled-components set is
# gated by scripts/verify-licenses.mjs (R-9, D5): a component with no recorded obligation fails
# the package step, so a licence question is a task, never a shipping delay.
appId: studio.arke.app
productName: Arke Studio
afterPack: scripts/verify-packaged-runtimes.mjs
# The workspace hoists electron to the repo root, so the builder cannot read an installed
# version from this package's node_modules — pin it (keep in step with the root devDependency).
electronVersion: 43.2.0
# Native modules are built by scripts/rebuild-native.mjs (prebuild first, node-gyp 13 fallback);
# the builder's own rebuild uses a node-gyp that fails against current Visual Studio.
npmRebuild: false
# Where an installed copy looks for its next version (SPEC-016 R-12, R-13). This block is what
# makes electron-builder emit `latest.yml` beside the installers and bake `app-update.yml` into
# the app — without it, autoUpdater.checkForUpdates() has no feed to read and fails silently.
#
# `releaseType: release` publishes the moment the tag builds, so a v* tag IS the upgrade — that
# is the whole point, and it is why the tag must never be pushed casually.
#
# This setting and the workflow must move together, and the workflow OPENS the release before
# this runs. Both halves are load-bearing:
#   - type must match: electron-builder refuses to upload into a release of a different type, and
#     it refuses by SKIPPING the upload — a release with no installer and no latest.yml, which
#     looks healthy on GitHub and silently breaks every client's update check.
#   - the release must already exist: left to create its own, electron-builder publishes each
#     artifact concurrently and two of them raced, producing TWO releases for one tag. Clients
#     resolved the wrong one and got `Cannot find latest.yml … 404`.
publish:
  provider: github
  owner: michaeljosiah
  repo: ArkeStudio
  releaseType: release
directories:
  output: release
files:
  - dist/**
  - package.json
# Native modules cannot load from inside the asar archive (SPEC-003 §2.9).
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3-electron/**"
extraResources:
  - from: ../../packages/client/dist
    to: client
  # Runtime preparation is a hard package prerequisite. ${arch} is expanded independently for
  # each target, while the installed path stays stable for main.ts.
  - from: build-resources/opencode
    to: opencode
    filter: ["**/*"]
  - from: build-resources/voxa/${arch}
    to: voxa
    filter: ["**/*"]
  - from: build-resources/ffmpeg
    to: ffmpeg
    filter: ["**/*"]
  # espeak-ng stays a SEPARATE EXECUTABLE, never linked (R-10, D6) — GPL, same arrangement Voxa makes.
  - from: build-resources/espeak-ng/${arch}
    to: espeak-ng
    filter: ["**/*"]
  # The sample world (SPEC-016 R-6). Specified as an optional download while it was 31 MB of
  # full-resolution art; at 12 MB, bundling costs less than the network dependency it removes —
  # a first run that promises no account, no key and no network should not need one to show
  # what the application is for.
  - from: ../../fixtures/worlds/the-undersong
    to: sample-world
    filter: ["**/*"]
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
win:
  target:
    - target: nsis
  # Signing (§2.7): supplied via environment on the signing machine — never committed.
  #   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD, or signtoolOptions for an HSM token.
nsis:
  buildUniversalInstaller: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ArkeStudio-Setup-${version}-${arch}.${ext}
  # The app root — worlds, ledger, credentials — is NOT app data and is never deleted by the
  # uninstaller by default (R-16, D10). The opt-ins live in installer.nsh, each labelled with
  # what it actually destroys.
  deleteAppDataOnUninstall: false
  include: installer.nsh

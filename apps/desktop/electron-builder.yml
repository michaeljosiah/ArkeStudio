# Working electron-builder target (SPEC-001 scope note). Signing, publish channels and the
# real update flow arrive with SPEC-016.
appId: studio.arke.app
productName: Arke Studio
directories:
  output: release
files:
  - dist/**
  - package.json
# Native modules cannot load from inside the asar archive (SPEC-003 §2.9).
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3-electron/**"
extraResources:
  - from: ../../packages/client/dist
    to: client
win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false

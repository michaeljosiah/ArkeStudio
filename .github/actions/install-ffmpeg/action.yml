name: Install FFmpeg
description: FFmpeg and ffprobe on the PATH, on Linux and on Windows, or the step fails saying so.
runs:
  using: composite
  steps:
    - name: Install FFmpeg (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
          exit 0
        fi
        # Two film jobs reached their fifteen-minute ceiling downloading from the first
        # Azure mirror before any test ran (40376796933 / 40380720937). Keep Ubuntu's
        # signed packages and release; select its ordinary archive in the runner mirrorlist.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
        fi
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends ffmpeg
    # The community feed answers 503 for hours at a time (2026-10-19: refused at 08:19 and 16:59,
    # fine at 11:13), and `choco` still exits 0 having installed nothing. So whether FFmpeg is on
    # the PATH is the test: try the feed three times, then take gyan.dev's release build directly.
    - name: Install FFmpeg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # A failed attempt is the loop's to judge, not a reason to stop the step.
        $PSNativeCommandUseErrorActionPreference = $false
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          choco install ffmpeg --yes --no-progress
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
          Write-Host "FFmpeg is not on the PATH after attempt $attempt"
          if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
        }
        if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 15
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg")
          $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
        }
        exit 0
    # A missing FFmpeg used to surface as `spawn ffmpeg ENOENT` inside the film test, which on
    # Windows then held the runner to the test's four-minute timeout. Stop here and say so.
    - name: Check FFmpeg
      shell: bash
      run: |
        ffmpeg -version
        ffprobe -version

# The gate every pull request must pass, on both the platform we ship (Windows) and the one
# that catches path and case assumptions (Linux). Lint, types, build and tests — no formatting
# check yet: 111 files predate the `format` script, and reformatting them is its own decision.
#
# Coordinator tests run in four shards per platform; other workspaces have a separate job.
# See scripts/ci-test.mjs for measurements and the automatic discovery that preserves coverage.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted — nobody reads the results of stale code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.os }} · ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    # The script kills steps silent for ten minutes; this ceiling also bounds suites that
    # keep printing forever. Keep enough room for setup, healthy work and the silence guard.
    # Rebalance growing suites rather than treating a busy runner as a resource leak.
    timeout-minutes: 30
    strategy:
      # One platform failing should still tell us about the other, and one shard failing should
      # still tell us about the rest of the suite.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    env:
      # The gate never launches Electron — it only reads the package's version and types, so the
      # ~100 MB binary is dead weight here. The packaging workflow fetches its own.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 is native: npm takes the published prebuild where one exists and compiles
      # from source where it doesn't. Either way it must succeed — the derived index depends on it.
      - run: npm ci

      # Lint, types and build describe the tree, not a slice of it, so they answer once per
      # platform rather than four times. Shard 1 carries them; the others go straight to tests.
      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Build
        if: matrix.shard == 1
        run: npm run build

      - name: Windows owned-process cleanup
        if: matrix.os == 'windows-latest' && matrix.shard == 3
        run: node --import tsx --test --test-timeout=60000 packages/coordinator/test/harness/owned-child.test.ts

      - name: Offline audio-listener worker protocol (no model or GPU)
        if: matrix.shard == 1
        run: python -I -B packages/coordinator/test/media/local_audio_listener_test.py

      - name: CI test planning
        if: matrix.shard == 1
        run: node --test scripts/ci-test-plan.test.mjs

      - name: Test
        run: node scripts/ci-test.mjs ${{ matrix.shard }}/4

  workspaces:
    name: ${{ matrix.os }} · Other workspaces
    runs-on: ${{ matrix.os }}
    # These previously followed coordinator shard 2. On Windows that combination exceeded
    # 30 minutes with no failed tests. Keep the ceiling and silence guard, split the work.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Check the native pipe before the many adapter sessions that depend on it.
      - name: Windows file helper
        if: matrix.os == 'windows-latest'
        run: node --import tsx --test --test-timeout=45000 --test-name-pattern="Unicode paths and large binary reads|in-place Windows reparse" packages/adapter-codex/test/confined-files.test.ts
      - name: Test
        run: node scripts/ci-test.mjs workspaces

  production-acceptance:
    name: ${{ matrix.os }} · Production Chat film
    runs-on: ${{ matrix.os }}
    # Measured on green main runs, 2026-10-19: Windows took 13m58s and 14m05s, nearly all of it the
    # two effect benchmarks, and Ubuntu about 10m30s. Fifteen left Windows one slow step from a
    # timeout, and a 1m40s FFmpeg install was that step: it cancelled a run in the audio benchmark
    # with every test passed. Twenty-five keeps a cancelled job meaning something is stuck.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The `runner` context does not exist at job level. Naming it in this env block made the whole
    # file invalid, so every push to main from #1592 on started no job at all, not just this one.
    # Step-level env and `with` can read it.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      ARKE_PRODUCTION_ACCEPTANCE_REAL_MEDIA: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      # The community feed answers 503 for hours at a time (2026-10-19: refused at 08:19 and 16:59,
      # fine at 11:13), and `choco` still exits 0 having installed nothing. So whether FFmpeg is on
      # the PATH is the test: try the feed three times, then take gyan.dev's release build directly.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          # A failed attempt is the loop's to judge, not a reason to stop the step.
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "FFmpeg is not on the PATH after attempt $attempt"
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
            Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 15
            Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg")
            $bin = (Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
            Add-Content $env:GITHUB_PATH $bin
          }
          exit 0
      # A missing FFmpeg used to surface as `spawn ffmpeg ENOENT` inside the film test, which on
      # Windows then held the runner to the test's four-minute timeout. Stop here and say so.
      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version
      # The ordinary shards cover the same authorities with the injected encoder. This job
      # additionally decodes provider fixtures and makes the native twelve-second review cut.
      - name: Make a film from Production Chat
        working-directory: packages/coordinator
        env:
          ARKE_PRODUCTION_ACCEPTANCE_DIR: ${{ runner.temp }}/arke-production-acceptance
        run: node --import tsx --test --test-timeout=240000 test/world-chat/production-acceptance.test.ts
      - name: Measure shared procedural effects
        # SPEC-055 adds 72 Air Particles fixtures. The 456 legacy fixtures retain their digest.
        run: node --import tsx scripts/benchmark-editor-effects.ts --output "${{ runner.temp }}/arke-editor-effects/benchmark.json" --expect-pixels-sha256 5ed3c1cbf7b5498a624950134e6185d31b8f2bca9ddfdbe8088c3a70a4a041ad
      - name: Verify native effect composition
        env:
          ARKE_EFFECT_NATIVE_REQUIRED: 1
          ARKE_EFFECT_EVIDENCE_DIR: ${{ runner.temp }}/arke-editor-effects/native
        run: node --import tsx --test --test-timeout=180000 packages/coordinator/test/media/editor-effect-native.test.ts
      - name: Measure prepared audio reaction
        run: node --expose-gc --import tsx scripts/benchmark-editor-effect-analysis.ts --output "${{ runner.temp }}/arke-editor-effects/analysis-benchmark.json" --expect-fixtures-sha256 58be9406a03f187bb479bc0f19ee639903671ff44e3e22513c18a7d2bdeadaca
      - name: Verify canonical audible analysis
        env:
          ARKE_EFFECT_NATIVE_REQUIRED: 1
          ARKE_EFFECT_EVIDENCE_DIR: ${{ runner.temp }}/arke-editor-effects/audio
        run: node --import tsx --test --test-timeout=180000 packages/coordinator/test/media/editor-effect-audio-native.test.ts packages/coordinator/test/productions/editor-effect-analysis.test.ts
      - name: Verify browser effect pixels
        if: runner.os == 'Linux'
        env:
          ARKE_CHROME: /usr/bin/google-chrome
          ARKE_EFFECT_EVIDENCE_DIR: ${{ runner.temp }}/arke-editor-effects/browser
        run: node --import tsx scripts/smoke-editor-effects-preview.mjs
      - name: Retain effect parity and performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-effects-${{ runner.os }}
          path: ${{ runner.temp }}/arke-editor-effects
          if-no-files-found: warn
      - name: Retain cards, spend and exported media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-chat-${{ runner.os }}
          path: ${{ runner.temp }}/arke-production-acceptance
          if-no-files-found: warn

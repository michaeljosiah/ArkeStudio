# The gate every pull request must pass, on both the platform we ship (Windows) and the one
# that catches path and case assumptions (Linux). Lint, types, build and tests — no formatting
# check yet: 111 files predate the `format` script, and reformatting them is its own decision.
#
# Tests run in four shards per platform because the coordinator suite is 89% of the repo's test
# time and has no hot file to remove — see scripts/ci-test.mjs for the measurements and why the
# split is by shard rather than by hand-written directory list.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run it interrupted — nobody reads the results of stale code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.os }} · ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    # A leaked file watcher holds a runner at "in progress" until GitHub's six-hour default kills
    # it — six billable hours to learn what a ceiling reports the same morning (one leaked
    # WorldStore cost exactly that on 2026-08-11).
    #
    # That job now belongs to the silence guard in scripts/ci-test.mjs, which kills a step that
    # has printed nothing for eight minutes. A hang and a slow run are indistinguishable to a
    # clock but not to the test runner, which prints a line per test right up until it stops —
    # so the guard measures the thing that actually differs, and a busy runner cannot trip it.
    #
    # What is left for the ceiling is the one case silence misses: a suite that never ends and
    # never stops talking. 20 minutes, measured 2026-08-28 over 88 jobs from 11 green runs:
    # windows-latest shards run 2m34s–8m44s (median 4m50s), ubuntu-latest 0m52s–3m14s (median
    # 1m39s). That is 2.3× headroom over the worst Windows shard. The number it replaces had
    # drifted to 1.7× as the suite grew, and the 25 before that to 1.3× — at which point a busy
    # runner produced the same red as a hung one, and a docs-only PR went red for it (#560).
    #
    # The two numbers are coupled, and the coupling is easy to break silently. The guard reports
    # at "however far the Test step got" plus eight minutes, so it only fires first while the
    # Test step stays under about eleven of these twenty. Today's worst is 7m40s. Past that the
    # ceiling quietly takes hang detection back and everything above stops being true, with no
    # signal that it happened — so raise the two together, or lower the guard. Note also that
    # the guard is more precise than the ceiling, not faster: on a shard that hangs at the very
    # end it reports later than the 15 minutes it replaced. Precision is the point.
    timeout-minutes: 20
    strategy:
      # One platform failing should still tell us about the other, and one shard failing should
      # still tell us about the rest of the suite.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    env:
      # The gate never launches Electron — it only reads the package's version and types, so the
      # ~100 MB binary is dead weight here. The packaging workflow fetches its own.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 is native: npm takes the published prebuild where one exists and compiles
      # from source where it doesn't. Either way it must succeed — the derived index depends on it.
      - run: npm ci

      # Lint, types and build describe the tree, not a slice of it, so they answer once per
      # platform rather than four times. Shard 1 carries them; the others go straight to tests.
      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Build
        if: matrix.shard == 1
        run: npm run build

      # Shard 2 also runs every workspace other than the coordinator — 50s of tests all told,
      # smaller than the cost of splitting them further, and put beside a shard that is not
      # already carrying lint, types and build.
      - name: Test
        run: node scripts/ci-test.mjs ${{ matrix.shard }}/4

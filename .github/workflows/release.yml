# Cuts a version. Push a tag like v0.2.0 and this builds the installers, writes the update
# metadata (latest.yml) that installed copies read, and PUBLISHES a GitHub Release holding both.
#
# Published, not drafted: a v* tag is the upgrade. Every installed copy will offer this build the
# next time it checks. That makes the tag the point of no return — it is easy to delete a release
# and impossible to un-tell the copies that already saw it.
#
# The difference from package.yml: that one hands you an installer to test, on any branch, with
# no update metadata and no release. This one is the published channel.
#
# Unsigned, for now. Signing needs WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (electron-builder.yml
# §2.7) on a machine trusted with the certificate. Until then every install and every update
# shows a SmartScreen warning — auto-update still works, it just cannot prove who built it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write # creating the release and uploading its assets

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A tag that disagrees with the version in package.json ships a build that lies about
      # itself, and electron-updater compares versions — so stop here rather than release it.
      # The same step refuses a tag with no release card: the card is the release's title and
      # body here and the application's What's new (SPEC-016 R-18), so a release without one
      # would announce nothing in either place. Cards began at v0.5.49; the checkout is the
      # tag's own tree, so a manual rebuild of an earlier tag is told apart by that boundary —
      # never by whether the checker happens to be present, or the gate would exempt exactly
      # the tag that dropped it — and is published from its annotation. A tag with a pre-release
      # suffix is published as one, so no installed copy is offered a beta as its next version.
      - name: The tag, the version and the release card must agree
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match apps/desktop/package.json version $version"
            exit 1
          fi
          core="${version%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          legacy=false
          if [ "${major:-0}" -lt 0 ] || { [ "${major:-0}" -eq 0 ] && [ "${minor:-0}" -lt 5 ]; } || { [ "${major:-0}" -eq 0 ] && [ "${minor:-0}" -eq 5 ] && [ "${patch:-0}" -lt 49 ]; }; then
            legacy=true
          fi
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          echo "RELEASE_LEGACY=$legacy" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          if [ "$legacy" = true ]; then
            echo "::warning::$tag predates release cards (v0.5.49); its notes come from the tag's annotation"
          else
            node scripts/release-notes.mjs check "$tag"
          fi
          echo "releasing $tag${prerelease:+ as a pre-release}"

      - run: npm ci

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the workspaces
        run: npm run build

      # Package without publishing. Voxa/espeak preparation, architecture validation, licence
      # checks and afterPack inspection all finish before the public release exists.
      - name: Package the release candidates
        run: npm run release --workspace @arke-studio/desktop

      - name: Smoke bundled Voxa
        run: npm run smoke:voxa:x64 --workspace @arke-studio/desktop

      # One serialized upload after both architectures pass. This avoids both the old concurrent
      # electron-builder release race and publishing a release before runtime gates complete.
      - name: Publish the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — replacing verified assets"
          else
            if [ "$RELEASE_LEGACY" = true ]; then
              gh release create "$tag" $RELEASE_PRERELEASE --title "$tag" --notes "$(git tag -l --format='%(contents)' "$tag")"
            else
              node scripts/release-notes.mjs body "$tag" > release-body.md
              gh release create "$tag" $RELEASE_PRERELEASE --title "$(node scripts/release-notes.mjs title "$tag")" --notes-file release-body.md
            fi
          fi
          gh release upload "$tag" apps/desktop/release/*.exe apps/desktop/release/*.blockmap apps/desktop/release/latest*.yml --clobber

      # A copy that outlives the release, so a botched one can still be inspected after
      # the release itself is deleted.
      - uses: actions/upload-artifact@v4
        with:
          name: ArkeStudio-${{ inputs.tag || github.ref_name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

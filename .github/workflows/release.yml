# Cuts a version. Push a tag like v0.2.0 and this builds the installers, writes the update
# metadata (latest.yml) that installed copies read, and PUBLISHES a GitHub Release holding both.
#
# Published, not drafted: a v* tag is the upgrade. Every installed copy will offer this build the
# next time it checks. That makes the tag the point of no return — it is easy to delete a release
# and impossible to un-tell the copies that already saw it.
#
# The difference from package.yml: that one hands you an installer to test, on any branch, with
# no update metadata and no release. This one is the published channel.
#
# Unsigned, for now. Signing needs WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (electron-builder.yml
# §2.7) on a machine trusted with the certificate. Until then every install and every update
# shows a SmartScreen warning — auto-update still works, it just cannot prove who built it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write # creating the release and uploading its assets

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A tag that disagrees with the version in package.json ships a build that lies about
      # itself, and electron-updater compares versions — so stop here rather than release it.
      - name: The tag and the version must agree
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match apps/desktop/package.json version $version"
            exit 1
          fi
          echo "releasing $tag"

      - run: npm ci

      - name: Build the workspaces
        run: npm run build

      # Create the release FIRST, so electron-builder has one to upload into.
      #
      # Letting it create its own looks simpler and is broken: it publishes each artifact
      # concurrently, and two of them raced to create the release for v0.2.0 and v0.2.1 —
      # same tag, same second, two releases. One got the installers and latest.yml, the other
      # got a single blockmap, and clients resolving "the release for this tag" hit the wrong
      # one: `Cannot find latest.yml … 404`. An app that cannot read the feed cannot update.
      #
      # Published, not draft, to match `releaseType: release` — electron-builder refuses to
      # upload into a release whose type differs, and it refuses by skipping the upload.
      - name: Open the release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists — uploading into it"
          else
            gh release create "$tag" --title "$tag" --notes "$(git tag -l --format='%(contents)' "$tag")"
          fi

      # --publish always: uploads the installers, the blockmaps and latest.yml into the release
      # opened above.
      - name: Package and publish the release
        run: npm run release --workspace @arke-studio/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A copy that outlives the release, so a botched one can still be inspected after
      # the release itself is deleted.
      - uses: actions/upload-artifact@v4
        with:
          name: ArkeStudio-${{ inputs.tag || github.ref_name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

# THROWAWAY. Round two: the same test, in the suite, where it competes for the runner's CPUs.
name: cold-scan probe

on:
  push:
    branches: ["scratch/**"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }} shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The whole suite, three times, reporting the cold scan each time
        shell: bash
        working-directory: packages/coordinator
        run: |
          echo "cpus: $(node -e 'console.log(require("node:os").availableParallelism())')"
          for rep in 1 2 3; do
            npm test 2>&1 | grep -E "cold scan|^# (pass|fail)" | sed "s/^/RESULT ${{ matrix.os }}-s${{ matrix.shard }} rep=$rep /" || true
          done

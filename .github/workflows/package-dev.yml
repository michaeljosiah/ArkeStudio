name: Package Studio Dev (Windows)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/package-dev.yml'
      - 'apps/desktop/config/aonik-dev.json'
      - 'apps/desktop/electron-builder.dev.yml'
      - 'apps/desktop/src/distribution.ts'

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ARKE_BUILD_CHANNEL: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.2xx
      - run: npm run build
      - run: npm run package --workspace @arke-studio/desktop
      - run: npm run smoke:voxa:x64 --workspace @arke-studio/desktop
      - name: Record installer hashes
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release-dev/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content apps/desktop/release-dev/SHA256SUMS.txt
          }
          "commit=$env:GITHUB_SHA`nchannel=arke-worlds-dev`ndeclaration=dev-creator-v1" | Set-Content apps/desktop/release-dev/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ArkeStudioDev-Windows-x64
          path: |
            apps/desktop/release-dev/*.exe
            apps/desktop/release-dev/SHA256SUMS.txt
            apps/desktop/release-dev/build-info.txt
          if-no-files-found: error
          retention-days: 30

><div class="who v1" style="grid-row:11"><b>Maren</b></div><div class="tx" style="grid-row:11"><span class="say">Ilo’s lantern is up here. He said it was<i class="cutm" title="Cut off here">—</i></span></div><div class="tk" style="grid-row:11"><span class="tkd" title="Not performed"></span></div><div class="who v3" style="grid-row:12"><b>Bray</b></div><div class="tx over" style="grid-row:12"><span class="dir">(cuts in)</span><span class="say">Two. Climb.</span></div><div class="tk" style="grid-row:12"><span class="tkd" title="Not performed"></span></div><div class="who cue" style="grid-row:13"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13 M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0 M20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg>Music</div><div class="tx fx" style="grid-row:13">Low drone enters, under.</div><div class="tk" style="grid-row:13"><span class="tkd kept" title="Kept take"></span></div><div class="who v6" style="grid-row:14"><b>Narrator</b></div><div class="tx nar" style="grid-row:14"><span class="say">She climbed. Behind her the water took the stairs the way a clock takes minutes.</span></div><div class="tk" style="grid-row:14"><span class="tkd" title="Not performed"></span></div><div class="who cue" style="grid-row:15"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z M15.5 8.5a5 5 0 0 1 0 7"/></svg>Sound</div><div class="tx fx" style="grid-row:15">Water takes the third stair.</div><div class="tk" style="grid-row:15"><span class="tkd kept" title="Kept take"></span></div><div class="who v3" style="grid-row:16"><b>Bray</b></div><div class="tx" style="grid-row:16"><span class="say">Three.</span></div><div class="tk" style="grid-row:16"><span class="tkd" title="Not performed"></span></div><div class="bed amb cont" style="grid-row:1 / 17" title="Ambience under these lines"></div><div class="bed mus" style="grid-row:13 / 17" title="Music under these lines"></div></div></div><aside class="side" aria-label="Source"><header><b>Source</b><small>Low Water v14</small><span class="gap"></span><button type="button" class="ib" aria-label="Close source" data-go="script"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg></button></header><div class="in"><div class="srchead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Chapter 3 · The bell tower</div><p class="srcp"><span class="pn">¶14</span>Far off — so far it might have been memory — the harbour bell struck once. Sereth’s signal. The turn.</p><p class="srcp"><span class="pn">¶15</span>“The log said two hours,” Maren said, and hated how young it sounded.</p><p class="srcp"><span class="pn">¶16</span>Bray did not answer. He was looking at the first stair, where the water had come back and was feeling for it like a hand in the dark.</p><p class="srcp"><span class="pn">¶17</span><span class="hl">She counted what the water had taken — one stair, then two —</span> and the lantern still three flights above her. Ilo had told her once that the tower ate stairs. She had thought it was a joke.</p><p class="srcp"><span class="pn">¶18</span>“Climb,” Bray said.</p><div class="decision"><div class="r"><span class="verdict hear">Hear</span><small class="mut">¶17 → Bray, “One.” and “Two. Climb.”</small></div><p>Maren counts in silence. Bray counts out loud, so the listener has a clock.</p><div class="acts"><button type="button" class="btn sm">Change</button><button type="button" class="btn sm ghost">Ask Arke</button></div></div><sp   stage.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-go]')) { e.preventDefault(); show(e.target.dataset.go); } if (e.key === 'Escape') { const back = { hear: 'select', hear2: 'select', ask: 'select', cue: 'script', publish: 'episodes', phear: 'pscript', psource: 'pscript', pcast: 'pscript', changed: 'map', hearquiet: 'quiet', addsound: 'cue', gensound: 'addsound', genamb: 'addsound' }[cur]; if (back) show(back); } });
  stage.addEventListener('input', e => { if (!e.target.matches('[data-reason]')) return; const b = e.target.closest('.decision')?.querySelector('[data-needs-reason]'); if (b) b.disabled = !e.target.value.trim(); });
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => show(b.dataset.jump)));

  addEventListener('resize', fit);
  show(T[location.hash.slice(1)] ? location.hash.slice(1) : 'door', false);

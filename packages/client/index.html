<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `connect-src` names the loopback coordinator over http as well as ws (issue 478): saving a
      picture reads the very bytes `img-src` already lets the page display, from the very origin
      `media-src` already lets it play. Reading them was refused while showing them was allowed,
      which is not a boundary — it is the same origin twice with two different answers.

      `object-src` names it for the same reason (issue 477): the artifact viewer embeds a filed
      PDF from that origin, and object-src has no default of its own — it falls back to
      `default-src 'self'`, which refuses the embed and leaves an empty frame with nothing on
      screen or in the console to say the policy was what stopped it.

      `frame-src` names it because `object-src` alone was not enough (issue 530): an `<object>`
      holding a PDF is *framing* to Chromium, and framing is governed by `frame-src`, which has
      no default of its own either. Permitting the origin under one directive and not the other
      left the embed refused exactly as before — the console said which directive had done it,
      the empty frame did not.

      `connect-src` names `data:` and `blob:` for the same reason once more: copying a picture
      reads it back the way saving one does, and a thumbnail the page holds as a blob or a data
      URL was displayable under `img-src` and unreadable under `connect-src`. The two schemes are
      this page's own bytes either way — nothing leaves the machine to fetch them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:* http://localhost:*; media-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'self' http://127.0.0.1:* http://localhost:*; frame-src 'self' http://127.0.0.1:* http://localhost:*; font-src 'self' data:; connect-src 'self' data: blob: http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*"
    />
    <!--
      resizes-content: the on-screen keyboard shrinks the page rather than covering it (issue 1403).
      Android Chrome's default only pans a covered page, so full-height screens — World Chat, a
      canon thread — kept their composer under the keyboard and gave the conversation what was
      left between the chrome and the keys. Held bars measure the keyboard themselves
      (useKeyboardInset); with the page resized that measure reads zero, so they are not moved twice.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141619" />
    <meta name="apple-mobile-web-app-title" content="Arke Studio" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <title>Arke Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

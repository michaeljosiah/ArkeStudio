[project]
name = "arke-local-speech"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[websocket,whisper]==1.15.0",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "av==18.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
